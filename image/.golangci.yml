version: "2"

formatters:
  enable:
    - gofumpt

linters:
  enable:
    - errorlint
    - modernize
  settings:
    errorlint:
      # See https://golangci-lint.run/usage/linters/#errorlint.
      # Only allow warnings about not using %w.
      errorf-multi: false
      asserts: false
      comparison: false
    staticcheck:
      checks: ["all", "-ST1000", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1005", "-QF1008"] # golangci-lint's default, we add -ST1005 and -QF1008
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
