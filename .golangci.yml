version: "2"

run:
  timeout: 5m
  # gitroot so exclusion paths can target common/image/storage modules.
  # Build tags are passed per-module via Make/CI --build-tags, not here.
  relative-path-mode: gitroot

formatters:
  enable:
    - gofumpt

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - ginkgolinter
    - makezero
    - misspell
    - modernize
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    errcheck:
      # Leave unchecked type assertions alone. For "impossible" asserts, a panic
      # at the conversion site is clearer than soft-failing with a default value.
      check-type-assertions: false
    errorlint:
      # See https://golangci-lint.run/usage/linters/#errorlint.
      # Only allow warnings about not using %w.
      errorf-multi: false
      asserts: false
      comparison: false
    staticcheck:
      checks:
        - all
        - -QF1008 # https://staticcheck.dev/docs/checks/#QF1008 Omit embedded fields from selector expression.
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - prealloc
        path: _test\.go
      - linters:
          - contextcheck
        path: ^common/libimage
        text: LookupImage
      # c/image uses capitalized error strings by convention.
      - linters:
          - staticcheck
        path: ^image/
        text: "ST1005:"
      # go.podman.io/image/v5/copy is a stable public package name; cannot rename.
      - linters:
          - predeclared
        path: ^image/copy/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
